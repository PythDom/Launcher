plugins {
    id 'com.android.application'
}

android {
    namespace 'org.pythdom.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'org.pythdom.launcher'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file('../launcher.keystore')
            storePassword 'launcher'
            keyAlias 'launcher'
            keyPassword 'launcher'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
