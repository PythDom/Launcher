<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Mobile Shortcuts</title>

<link rel="manifest" href="manifest.json">

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #e6e6e6;
}

header {
    position: sticky;
    top: 0;
    background: #d0d0d0;
    padding: 10px;
}

input {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    box-sizing: border-box;
}

details {
    margin: 10px;
    background: #f4f4f4;
    padding: 10px;
    border-radius: 10px;
}

summary {
    font-size: 20px;
    font-weight: bold;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 12px;
    margin-top: 10px;
}

.item img {
    width: 75px;
    height: 75px;
    object-fit: contain;
    background: white;
    border-radius: 14px;
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<header>
<input id="search" placeholder="Search shortcuts...">
</header>

<script>
// SEARCH (PWA SAFE + RELIABLE)
const input = document.getElementById("search");

input.addEventListener("input", () => {
    const q = input.value.toLowerCase().trim();

    document.querySelectorAll(".item").forEach(el => {
        const s = el.getAttribute("data-search") || "";
        el.style.display = s.includes(q) ? "" : "none";
    });
});

// SERVICE WORKER
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}
</script>
